<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f16"><link rel="manifest" href="manifest.json"><title>FPL Draft Assistant</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f16;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,760px);margin:auto;padding:20px 14px 90px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.title{font-size:28px;font-weight:800}.sub{color:#94a3b8;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:16px}.tab{padding:11px 5px;border:1px solid #334155;border-radius:12px;background:#172033;color:#cbd5e1;font-weight:700;font-size:13px}.tab.active{background:#f8fafc;color:#0b0f16}.panel{display:none}.panel.active{display:block}.card{background:#111827;border:1px solid #243044;border-radius:16px;padding:14px;margin-bottom:9px}.rank{display:flex;align-items:center;gap:12px}.num{width:27px;color:#64748b;font-weight:800}.name{font-weight:800}.meta{color:#94a3b8;font-size:12px;margin-top:3px}.score{margin-left:auto;text-align:right}.rating{font-size:22px;font-weight:900}.xp{color:#94a3b8;font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{font-size:11px;color:#cbd5e1;background:#1e293b;border-radius:999px;padding:4px 7px}.reason{font-size:12px;color:#cbd5e1;margin-top:9px;line-height:1.4}.form{font-weight:800}.empty{padding:28px 8px;color:#94a3b8;text-align:center}.search{width:100%;padding:13px;border-radius:12px;border:1px solid #334155;background:#111827;color:#fff;font-size:16px;margin-bottom:10px}.save{width:100%;padding:12px;border:0;border-radius:12px;background:#f8fafc;color:#0b0f16;font-weight:800;margin-top:8px}.owned{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.owned button{border:1px solid #334155;background:#172033;color:#fff;border-radius:999px;padding:7px 10px}.hint{font-size:12px;color:#64748b;line-height:1.45;margin:10px 0}.section{font-size:16px;font-weight:800;margin:16px 0 8px}
</style></head><body><main>
<div class="head"><div><div class="title">FPL Draft Assistant</div><div id="status" class="sub">Загрузка данных…</div></div><div class="sub" id="gw"></div></div>
<div class="tabs" id="tabs"><button class="tab active" data-tab="recommend">🎯 Рекомендации</button><button class="tab" data-tab="transfers">🔄 Замены</button><button class="tab" data-tab="GK">🧤 Вратари</button><button class="tab" data-tab="DEF">🛡️ Защитники</button><button class="tab" data-tab="MID">⚡ Полузащитники</button><button class="tab" data-tab="FWD">🔥 Нападающие</button></div>
<section id="recommend" class="panel active"></section><section id="transfers" class="panel"></section><section id="GK" class="panel"></section><section id="DEF" class="panel"></section><section id="MID" class="panel"></section><section id="FWD" class="panel"></section>
</main>
<script>
const DATA_URL='https://fantasy.premierleague.com/api/bootstrap-static/';
const FALLBACK='data/fpl.json';
let data=null, players=[], teams={}, fixtures=[];
const pos={1:'GK',2:'DEF',3:'MID',4:'FWD'};
const ownedKey='fpl-draft-owned-v1';
function clamp(x,a=0,b=100){return Math.max(a,Math.min(b,x||0))}
function owned(){try{return JSON.parse(localStorage.getItem(ownedKey)||'[]')}catch{return[]}}
function saveOwned(a){localStorage.setItem(ownedKey,JSON.stringify(a))}
function fixtureInfo(p){const future=fixtures.filter(f=>!f.finished && (f.team_h===p.team||f.team_a===p.team)).sort((a,b)=>new Date(a.kickoff_time)-new Date(b.kickoff_time));if(!future.length)return {opp:'—',fdr:3,home:false};const f=future[0],home=f.team_h===p.team,opp=teams[home?f.team_a:f.team_h];return {opp:opp?.short_name||opp?.name||'?',fdr:home?(opp?.strength||3):(opp?.strength||3),home}}
function rating(p){const mins=clamp(p.minutes/34);const form=clamp((Number(p.form)||0)*10);const ppg=clamp((Number(p.points_per_game)||0)*10);const ict=clamp((Number(p.ict_index)||0)*5);const threat=clamp((Number(p.threat)||0)/2);const chance=clamp((p.chance_of_playing_next_round==null?100:p.chance_of_playing_next_round));const fx=clamp(120-fixtureInfo(p).fdr*20);return Math.round(.18*mins+.18*form+.16*ppg+.14*ict+.10*threat+.14*chance+.10*fx)}
function xpts(p){const r=rating(p);const ppg=Number(p.points_per_game)||0;return Math.round((ppg*(.45+r/200)+fixtureInfo(p).fdr*0.05)*10)/10}
function enrich(p){const fi=fixtureInfo(p),r=rating(p),xp=xpts(p);return {...p,_pos:pos[p.element_type],_rating:r,_xp:xp,_fi:fi}}
function card(p,i,extra=''){return `<div class="card"><div class="rank"><div class="num">${i+1}</div><div><div class="name">${p.web_name}</div><div class="meta">${teams[p.team]?.name||''} · £${(p.now_cost/10).toFixed(1)}m · ${p._fi.home?'дома':'в гостях'} vs ${p._fi.opp}</div></div><div class="score"><div class="rating">${p._rating}</div><div class="xp">xPts ${p._xp}</div></div></div><div class="chips"><span class="chip">Форма ${p.form||'0'}</span><span class="chip">PPG ${p.points_per_game||'0'}</span><span class="chip">Мин ${p.minutes}</span><span class="chip">${p.selected_by_percent||'0'}% owned</span>${extra}</div></div>`}
function renderLists(){const all=players.map(enrich);for(const k of ['GK','DEF','MID','FWD']){const top=all.filter(p=>p._pos===k).sort((a,b)=>b._rating-a._rating||b._xp-a._xp).slice(0,30);document.getElementById(k).innerHTML=`<div class="section">TOP-30 · ${k==='GK'?'Вратари':k==='DEF'?'Защитники':k==='MID'?'Полузащитники':'Нападающие'}</div>${top.map((p,i)=>card(p,i)).join('')}`}}
function renderRecommend(){const all=players.map(enrich),free=all.filter(p=>!owned().includes(p.id)).sort((a,b)=>b._rating-a._rating||b._xp-a._xp).slice(0,15);document.getElementById('recommend').innerHTML=`<div class="section">Кого рассмотреть сейчас</div><div class="hint">Рейтинг 0–100 пока является первой версией модели. Он использует текущие FPL-данные, форму, PPG, ICT, минуты, вероятность участия и ближайший матч. Позже добавим историческую валидацию и внешнюю статистику.</div>${free.map((p,i)=>card(p,i,`<span class="chip">Следующий: ${p._fi.opp}</span>`)).join('')}`}
function renderTransfers(){const all=players.map(enrich), ids=new Set(owned()), mine=all.filter(p=>ids.has(p.id));const free=all.filter(p=>!ids.has(p.id));let html=`<div class="section">Мои игроки</div><input id="playerSearch" class="search" placeholder="Найти игрока и добавить в состав…"><div id="owned" class="owned">${mine.map(p=>`<button data-remove="${p.id}">${p.web_name} ×</button>`).join('')||'<span class="hint">Пока пусто</span>'}</div><button class="save" id="clearOwned">Очистить мой состав</button><div class="section">Лучшие замены</div>`;for(const p of mine){const candidates=free.filter(q=>q._pos===p._pos).sort((a,b)=>(b._xp-a._xp)).slice(0,3);html+=`<div class="card"><div class="name">${p.web_name} →</div>${candidates.map(q=>`<div class="reason"><b>${q.web_name}</b> · +${Math.max(0,Math.round((q._xp-p._xp)*10)/10)} xPts · рейтинг ${q._rating}</div>`).join('')}</div>`}document.getElementById('transfers').innerHTML=html;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{saveOwned(owned().filter(id=>id!==Number(b.dataset.remove)));renderTransfers()});document.getElementById('clearOwned').onclick=()=>{saveOwned([]);renderTransfers()};const s=document.getElementById('playerSearch');s.oninput=()=>{const q=s.value.toLowerCase();let box=document.getElementById('owned');if(q.length<2){box.innerHTML=mine.map(p=>`<button data-remove="${p.id}">${p.web_name} ×</button>`).join('');return}const hits=all.filter(p=>p.web_name.toLowerCase().includes(q)).slice(0,8);box.innerHTML=hits.map(p=>`<button data-add="${p.id}">${p.web_name} +</button>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const ids=owned();if(!ids.includes(Number(b.dataset.add)))ids.push(Number(b.dataset.add));saveOwned(ids);renderTransfers()})}}
async function load(){try{let r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw Error();data=await r.json()}catch{try{let r=await fetch(FALLBACK+'?t='+Date.now());data=await r.json()}catch{document.getElementById('status').textContent='Не удалось загрузить FPL';return}}players=data.elements||[];(data.teams||[]).forEach(t=>teams[t.id]=t);fixtures=data.fixtures||[];const ev=(data.events||[]).find(e=>e.is_next)||(data.events||[]).find(e=>e.is_current);document.getElementById('gw').textContent=ev?`GW ${ev.id}`:'';document.getElementById('status').textContent=`Обновлено ${new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}`;renderRecommend();renderLists();renderTransfers()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active')});load();
</script></body></html>
