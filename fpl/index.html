<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f16"><link rel="manifest" href="manifest.json"><title>FPL Draft Assistant</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f16;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,760px);margin:auto;padding:20px 14px 90px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.title{font-size:28px;font-weight:800}.sub{color:#94a3b8;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:16px}.tab{padding:11px 5px;border:1px solid #334155;border-radius:12px;background:#172033;color:#cbd5e1;font-weight:700;font-size:13px}.tab.active{background:#f8fafc;color:#0b0f16}.panel{display:none}.panel.active{display:block}.card{background:#111827;border:1px solid #243044;border-radius:16px;padding:14px;margin-bottom:9px}.rank{display:flex;align-items:center;gap:12px}.num{width:27px;color:#64748b;font-weight:800}.name{font-weight:800}.meta{color:#94a3b8;font-size:12px;margin-top:3px}.score{margin-left:auto;text-align:right}.rating{font-size:22px;font-weight:900}.xp{color:#94a3b8;font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{font-size:11px;color:#cbd5e1;background:#1e293b;border-radius:999px;padding:4px 7px}.reason{font-size:12px;color:#cbd5e1;margin-top:9px;line-height:1.4}.search{width:100%;padding:13px;border-radius:12px;border:1px solid #334155;background:#111827;color:#fff;font-size:16px;margin-bottom:10px}.owned{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.owned button{border:1px solid #334155;background:#172033;color:#fff;border-radius:999px;padding:7px 10px}.hint{font-size:12px;color:#64748b;line-height:1.45;margin:10px 0}.section{font-size:16px;font-weight:800;margin:16px 0 8px}.error{padding:20px;border:1px solid #7f1d1d;border-radius:14px;background:#2a1115;color:#fecaca}</style></head><body><main><div class="head"><div><div class="title">FPL Draft Assistant</div><div id="status" class="sub">Подключение к данным…</div></div><div class="sub">2026/27</div></div><div class="tabs"><button class="tab active" data-tab="recommend">🎯 Рекомендации</button><button class="tab" data-tab="transfers">🔄 Замены</button><button class="tab" data-tab="GK">🧤 Вратари</button><button class="tab" data-tab="DEF">🛡️ Защитники</button><button class="tab" data-tab="MID">⚡ Полузащитники</button><button class="tab" data-tab="FWD">🔥 Нападающие</button></div><section id="recommend" class="panel active"></section><section id="transfers" class="panel"></section><section id="GK" class="panel"></section><section id="DEF" class="panel"></section><section id="MID" class="panel"></section><section id="FWD" class="panel"></section></main><script>
const API='https://fpl-draft-api.markfranklinunez.workers.dev/players';
const ownedKey='fpl-draft-owned-v2';let players=[];const owned=()=>{try{return JSON.parse(localStorage.getItem(ownedKey)||'[]')}catch{return[]}};const save=a=>localStorage.setItem(ownedKey,JSON.stringify(a));
function score(p){return Number.isFinite(Number(p.rating))?Number(p.rating):Math.round((Number(p.epNext)||0)*15+(Number(p.form)||0)*2+(Number(p.xGI90)||0)*8)}
function xp(p){return Number(p.epNext)||0}
function card(p,i){return `<div class="card"><div class="rank"><div class="num">${i+1}</div><div><div class="name">${p.name}</div><div class="meta">${p.team||''} · £${Number(p.price||0).toFixed(1)}m</div></div><div class="score"><div class="rating">${score(p)}</div><div class="xp">xPts ${xp(p).toFixed(1)}</div></div></div><div class="chips"><span class="chip">Форма ${Number(p.form||0).toFixed(1)}</span><span class="chip">PPG ${Number(p.pointsPerGame||0).toFixed(1)}</span><span class="chip">xG ${Number(p.expectedGoals||0).toFixed(2)}</span><span class="chip">xA ${Number(p.expectedAssists||0).toFixed(2)}</span><span class="chip">Мин ${p.minutes||0}</span></div>${p.news?`<div class="reason">${p.news}</div>`:''}</div>`}
function renderPosition(pos,id,title){const list=players.filter(p=>p.position===pos).sort((a,b)=>score(b)-score(a)||xp(b)-xp(a)).slice(0,30);document.getElementById(id).innerHTML=`<div class="section">${title}</div>${list.map(card).join('')||'<div class="hint">Нет данных.</div>'}`}
function renderRecommend(){const ids=new Set(owned());const list=players.filter(p=>!ids.has(p.id)).sort((a,b)=>score(b)-score(a)||xp(b)-xp(a)).slice(0,15);document.getElementById('recommend').innerHTML=`<div class="section">На кого обратить внимание</div><div class="hint">Рейтинг пока базовый: он использует ep_next, форму, PPG, xGI/90 и доступные данные источника. Историческую калибровку добавим следующим этапом.</div>${list.map(card).join('')}`}
function renderTransfers(){const ids=new Set(owned()),mine=players.filter(p=>ids.has(p.id));let html=`<div class="section">Мой состав</div><input id="search" class="search" placeholder="Найти игрока…"><div id="owned" class="owned">${mine.map(p=>`<button data-remove="${p.id}">${p.name} ×</button>`).join('')||'<span class="hint">Добавь игроков вручную.</span>'}</div><div class="section">Рекомендации по заменам</div>`;for(const p of mine){const candidates=players.filter(q=>q.id!==p.id&&!ids.has(q.id)&&q.position===p.position).sort((a,b)=>xp(b)-xp(a)).slice(0,3);html+=`<div class="card"><div class="name">${p.name} →</div>${candidates.map(q=>`<div class="reason"><b>${q.name}</b> · ${Math.max(0,xp(q)-xp(p)).toFixed(1)} потенциальных xPts · рейтинг ${score(q)}</div>`).join('')}</div>`}document.getElementById('transfers').innerHTML=html;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{save(owned().filter(id=>id!==Number(b.dataset.remove)));renderTransfers()});const s=document.getElementById('search');s.oninput=()=>{const q=s.value.toLowerCase();const box=document.getElementById('owned');const hits=players.filter(p=>p.name.toLowerCase().includes(q)).slice(0,10);if(q.length<2){box.innerHTML=mine.map(p=>`<button data-remove="${p.id}">${p.name} ×</button>`).join('');return}box.innerHTML=hits.map(p=>`<button data-add="${p.id}">${p.name} +</button>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const a=owned();const id=Number(b.dataset.add);if(!a.includes(id))a.push(id);save(a);renderTransfers()})}}
async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();players=d.players||[];document.getElementById('status').textContent=`Данные: ${d.source||'backend'} · ${d.updated||''}`;renderRecommend();renderTransfers();renderPosition('GK','GK','TOP-30 · Вратари');renderPosition('DEF','DEF','TOP-30 · Защитники');renderPosition('MID','MID','TOP-30 · Полузащитники');renderPosition('FWD','FWD','TOP-30 · Нападающие')}catch(e){document.getElementById('status').textContent='Ошибка загрузки';document.getElementById('recommend').innerHTML=`<div class="error">Не удалось получить данные backend.<br><br>${e.message}</div>`}}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active')});load();
</script></body></html>
