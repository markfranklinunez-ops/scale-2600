<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f16"><link rel="manifest" href="manifest.json"><title>FPL Draft Assistant</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f16;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(100%,760px);margin:auto;padding:20px 14px 90px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.title{font-size:28px;font-weight:800}.sub{color:#94a3b8;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:16px}.tab{padding:11px 5px;border:1px solid #334155;border-radius:12px;background:#172033;color:#cbd5e1;font-weight:700;font-size:13px}.tab.active{background:#f8fafc;color:#0b0f16}.panel{display:none}.panel.active{display:block}.card,.transfer{background:#111827;border:1px solid #243044;border-radius:16px;padding:14px;margin-bottom:9px}.rank,.transferHead{display:flex;align-items:center;gap:12px}.num{width:27px;color:#64748b;font-weight:800}.name{font-weight:800}.meta,.mini{color:#94a3b8;font-size:12px;margin-top:3px}.score{margin-left:auto;text-align:right}.rating{font-size:22px;font-weight:900}.xp{color:#94a3b8;font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{font-size:11px;color:#cbd5e1;background:#1e293b;border-radius:999px;padding:4px 7px}.fixture{font-size:12px;color:#e2e8f0;margin-top:9px;font-weight:700}.reason{font-size:12px;color:#cbd5e1;margin-top:9px;line-height:1.4}.search{width:100%;padding:13px;border-radius:12px;border:1px solid #334155;background:#111827;color:#fff;font-size:16px;margin-bottom:10px}.owned{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.owned button,.candidate button{border:1px solid #334155;background:#172033;color:#fff;border-radius:999px;padding:7px 10px}.hint{font-size:12px;color:#64748b;line-height:1.45;margin:10px 0}.section{font-size:16px;font-weight:800;margin:16px 0 8px}.error{padding:20px;border:1px solid #7f1d1d;border-radius:14px;background:#2a1115;color:#fecaca}.candidate{border-top:1px solid #243044;margin-top:10px;padding-top:10px}.arrow{color:#64748b;font-size:18px}.delta{font-weight:900;font-size:18px}.positive{color:#86efac}.negative{color:#fca5a5}.neutral{color:#fbbf24}.verdict{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;margin-top:8px}.doit{background:#12351f;color:#86efac}.consider{background:#3a2d0b;color:#fbbf24}.keep{background:#1e293b;color:#cbd5e1}.selectPos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 12px}.selectPos button{padding:8px 4px;border:1px solid #334155;border-radius:10px;background:#172033;color:#cbd5e1;font-weight:700;font-size:12px}.selectPos button.active{background:#e2e8f0;color:#0b0f16}.empty{padding:16px;background:#111827;border:1px dashed #334155;border-radius:14px;color:#94a3b8;font-size:13px}.metric{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #1e293b}.metric:last-child{border-bottom:0}</style></head><body><main><div class="head"><div><div class="title">FPL Draft Assistant</div><div id="status" class="sub">Подключение к данным…</div></div><div class="sub">2026/27</div></div><div class="tabs"><button class="tab active" data-tab="recommend">🎯 Рекомендации</button><button class="tab" data-tab="transfers">🔄 Замены</button><button class="tab" data-tab="GK">🧤 Вратари</button><button class="tab" data-tab="DEF">🛡️ Защитники</button><button class="tab" data-tab="MID">⚡ Полузащитники</button><button class="tab" data-tab="FWD">🔥 Нападающие</button></div><section id="recommend" class="panel active"></section><section id="transfers" class="panel"></section><section id="GK" class="panel"></section><section id="DEF" class="panel"></section><section id="MID" class="panel"></section><section id="FWD" class="panel"></section></main><script>
const API='https://fpl-draft-api.markfranklinunez.workers.dev/players',POS=['GK','DEF','MID','FWD'],POSNAME={GK:'Вратари',DEF:'Защитники',MID:'Полузащитники',FWD:'Нападающие'},ownedKey='fpl-draft-owned-v3';let players=[],transferPos='GK';
const owned=()=>{try{return JSON.parse(localStorage.getItem(ownedKey)||'[]').map(Number)}catch{return[]}};const save=a=>localStorage.setItem(ownedKey,JSON.stringify([...new Set(a.map(Number))]));
function score(p){return Number.isFinite(Number(p.draftScore))?Number(p.draftScore):Number(p.rating)||0}function xp(p){return Number(p.epNext)||0}function fdr(p){const n=Number(p.fixtureDifficulty);return Number.isFinite(n)?n:3}function price(p){return Number(p.price)||0}
function card(p,i){return `<div class="card"><div class="rank"><div class="num">${i+1}</div><div><div class="name">${p.name}</div><div class="meta">${p.team||''} · £${price(p).toFixed(1)}m</div></div><div class="score"><div class="rating">${score(p)}</div><div class="xp">xPts ${xp(p).toFixed(1)}</div></div></div>${p.fixture&&p.fixture!=='—'?`<div class="fixture">Следующий тур: ${p.fixture} · FDR ${p.fixtureDifficulty??'—'}</div>`:''}<div class="chips"><span class="chip">Форма ${Number(p.form||0).toFixed(1)}</span><span class="chip">PPG ${Number(p.ppg||0).toFixed(1)}</span><span class="chip">xG ${Number(p.xG||0).toFixed(2)}</span><span class="chip">xA ${Number(p.xA||0).toFixed(2)}</span><span class="chip">Мин ${p.minutes||0}</span></div>${p.news?`<div class="reason">${p.news}</div>`:''}</div>`}
function renderPosition(pos,id,title){const list=players.filter(p=>p.position===pos).sort((a,b)=>score(b)-score(a)||xp(b)-xp(a)).slice(0,30);document.getElementById(id).innerHTML=`<div class="section">${title}</div>${list.map(card).join('')||'<div class="hint">Нет данных.</div>'}`}
function renderRecommend(){const ids=new Set(owned()),list=players.filter(p=>!ids.has(p.id)).sort((a,b)=>score(b)-score(a)||xp(b)-xp(a)).slice(0,15);document.getElementById('recommend').innerHTML=`<div class="section">На кого обратить внимание перед туром</div><div class="hint">Рейтинг учитывает ожидаемые очки, форму, PPG, xGI/90, доступность, игровое время и сложность ближайшего матча.</div>${list.map(card).join('')||'<div class="hint">Нет рекомендаций.</div>'}`}
function threeTurnScore(p){const base=xp(p),calendar=1+(3-fdr(p))*0.055,availability=(Number(p.chanceNext)>0&&Number(p.chanceNext)<75)?0.72:Number(p.starts)>0?1:0.9;return base*3*calendar*availability}
function replacement(p,q){const dx=xp(q)-xp(p),ds=score(q)-score(p),three=threeTurnScore(q)-threeTurnScore(p),formDelta=Number(q.form||0)-Number(p.form||0),fdrDelta=fdr(p)-fdr(q);return{dx,ds,three,formDelta,fdrDelta,value:three*0.62+ds*0.08+formDelta*0.18+fdrDelta*0.45}}
function transferCandidates(p,ids){return players.filter(q=>q.id!==p.id&&!ids.has(q.id)&&q.position===p.position).map(q=>({q,r:replacement(p,q)})).sort((a,b)=>b.r.value-a.r.value).slice(0,4)}
function verdict(r){if(r.three>=2&&r.dx>=0.5&&r.value>=1.5)return['СДЕЛАТЬ ЗАМЕНУ','doit'];if(r.three>=0.8&&r.value>=0.7)return['РАССМОТРЕТЬ','consider'];return['ОСТАВИТЬ','keep']}
function transferRow(q,r){const [text,cls]=verdict(r);return `<div class="reason"><div class="transferHead"><div><b>→ ${q.name}</b><div class="mini">${q.team} · £${price(q).toFixed(1)}m · ${q.fixture||'нет матча'} · FDR ${q.fixtureDifficulty??'—'}</div></div><div><div class="delta ${r.dx>=0?'positive':'negative'}">${r.dx>=0?'+':''}${r.dx.toFixed(1)} xPts</div><div class="mini">3 тура: ${r.three>=0?'+':''}${r.three.toFixed(1)}</div></div></div><span class="verdict ${cls}">${text}</span></div>`}
function renderTransfers(){const ids=new Set(owned()),mine=players.filter(p=>ids.has(p.id));let html=`<div class="section">Мой состав</div><div class="hint">В FPL Draft нет бюджета, поэтому цена не влияет на решение. Состав хранится на этом устройстве.</div><input id="search" class="search" placeholder="Найти игрока для добавления…"><div id="owned" class="owned">${mine.map(p=>`<button data-remove="${p.id}">${p.name} ×</button>`).join('')||'<span class="hint">Пока пусто.</span>'}</div>`;if(!mine.length)html+=`<div class="empty">Добавь игроков, и здесь появятся персональные рекомендации.</div>`;else{html+=`<div class="section">Умные рекомендации по заменам</div><div class="hint">Оценка на 3 тура построена на доступном xPts и FDR ближайшего матча, плюс форма, доступность и Draft Score. Это именно модель оценки, а не официальный прогноз.</div>`;for(const p of mine){const cs=transferCandidates(p,ids);html+=`<div class="transfer"><div class="transferHead"><div><div class="name">${p.name}</div><div class="mini">${p.team} · ${POSNAME[p.position]} · ${p.fixture||'нет матча'}</div></div><div class="score"><div class="rating">${score(p)}</div><div class="xp">xPts ${xp(p).toFixed(1)}</div></div></div>${cs.map(({q,r})=>transferRow(q,r)).join('')||'<div class="hint">Нет подходящей замены.</div>'}</div>`}}html+=`<div class="section">Добавить игрока</div><div class="selectPos">${POS.map(pos=>`<button class="posBtn ${transferPos===pos?'active':''}" data-pos="${pos}">${POSNAME[pos]}</button>`).join('')}</div><div id="addResults" class="owned"></div>`;document.getElementById('transfers').innerHTML=html;const search=document.getElementById('search'),renderAdd=()=>{const q=search.value.trim().toLowerCase(),hits=players.filter(p=>p.position===transferPos&&!ids.has(p.id)&&(q.length<1||p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q))).sort((a,b)=>score(b)-score(a)).slice(0,12);document.getElementById('addResults').innerHTML=hits.map(p=>`<button data-add="${p.id}">+ ${p.name} · ${p.team}</button>`).join('')};renderAdd();search.oninput=renderAdd;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{save(owned().filter(id=>id!==Number(b.dataset.remove)));renderTransfers();renderRecommend()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const a=owned(),id=Number(b.dataset.add);if(!a.includes(id))a.push(id);save(a);renderTransfers();renderRecommend()});document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{transferPos=b.dataset.pos;renderTransfers()})}
async function load(){try{const responses=await Promise.all(POS.map(async pos=>{const r=await fetch(`${API}?position=${pos}&limit=1000`,{cache:'no-store'});if(!r.ok)throw new Error(`${pos}: HTTP ${r.status}`);return{pos,data:await r.json()}}));const byId=new Map;responses.forEach(({data})=>(data.players||[]).forEach(p=>byId.set(p.id,p)));players=[...byId.values()];const stamps=responses.map(x=>x.data.updated).filter(Boolean),gw=responses.find(x=>x.data.nextGameweek)?.data.nextGameweek||'';document.getElementById('status').textContent=`FPL-Core-Insights · ${players.length} игроков · следующий тур ${gw} · ${stamps[0]||''}`;renderRecommend();renderTransfers();renderPosition('GK','GK','TOP-30 · Вратари');renderPosition('DEF','DEF','TOP-30 · Защитники');renderPosition('MID','MID','TOP-30 · Полузащитники');renderPosition('FWD','FWD','TOP-30 · Нападающие')}catch(e){document.getElementById('status').textContent='Ошибка загрузки';document.getElementById('recommend').innerHTML=`<div class="error">Не удалось получить данные backend.<br><br>${e.message}</div>`}}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active');if(t.dataset.tab==='transfers')renderTransfers()});load();</script></body></html>
